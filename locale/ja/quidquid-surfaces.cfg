[mod-name]
quidquid-surfaces=Quidquid: Surfaces

[mod-description]
quidquid-surfaces=Quidquidのパレットで惑星と宇宙プラットフォームを検索できるようにします。リモートビューとファクトリオペディアの操作ができます。

[mod-setting-name]
quidquid-surfaces-default-search=サーフィスを標準の検索に含める

[mod-setting-description]
quidquid-surfaces-default-search=検索対象を絞り込まなくても、Quidquidの検索に惑星と宇宙プラットフォームを表示します。オフにすると、サーフィスに絞り込んだ検索でのみ表示されます。

[quidquid-surfaces]
source-surfaces=サーフィス
surface-with-force=__1__(__2__)

action-open-remote-view-unavailable=__1__ __2__のリモートビューは開けません
action-open-remote-view-not-visited=__1__ __2__は未訪問のため開けません
action-open-remote-view-not-unlocked=__1__ __2__はまだアンロックされていません
action-open-factoriopedia-unavailable=__1__ __2__のファクトリオペディアは開けません
